name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify executable adapter commands
        run: |
          test -x bin/ai-workflow
          test -x bin/ai-workflow-doctor
          test -x bin/check-workflow-leak

      - name: Check shell syntax
        run: bash -n bin/ai-workflow bin/ai-workflow-doctor bin/check-workflow-leak tests/test-adapter.sh

      - name: Run adapter contract tests
        run: bash tests/test-adapter.sh

      - name: Check for private workflow leakage
        run: ./bin/check-workflow-leak
